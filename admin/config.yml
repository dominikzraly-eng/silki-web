backend:
  name: github
  repo: dominikzraly-eng/silki-web
  branch: main
  base_url: https://silkihair.cz
  auth_endpoint: api/auth

# Kam se ukládají nahrané fotky a odkud se na webu odkazují
media_folder: "assets/img/uploads"
public_folder: "assets/img/uploads"

locale: "cs"

collections:
  - name: "produkty"
    label: "Sortiment (culíky)"
    description: "Přidejte, upravte nebo odeberte jednotlivé kusy. Cena se na webu dopočítá automaticky (gramáž × cena za gram)."
    files:
      - file: "data/products.json"
        label: "Seznam kusů"
        name: "produkty"
        fields:
          - label: "Kusy"
            name: "produkty"
            widget: "list"
            summary: "{{fields.cislo}} — {{fields.odstin}} {{fields.delka_label}} cm ({{fields.stav}})"
            fields:
              - { label: "Číslo kusu", name: "cislo", widget: "string", hint: "např. SK-013" }
              - label: "Stav"
                name: "stav"
                widget: "select"
                options:
                  - { label: "Skladem", value: "in" }
                  - { label: "Prodáno", value: "sold" }
                default: "in"
              - label: "Odstín"
                name: "odstin"
                widget: "select"
                options: ["Tmavé", "Střední", "Blond"]
              - label: "Kvalita / řada"
                name: "kvalita"
                widget: "select"
                options:
                  - { label: "Evropské panenské", value: "panenske" }
                  - { label: "Evropské výběrové", value: "vyberove" }
                default: "panenske"
                hint: "Do které řady kus patří — určuje filtr v sortimentu."
              - { label: "Délka od (cm, číslo pro filtr)", name: "delka_cm", widget: "number", hint: "spodní hranice rozmezí, např. 51" }
              - { label: "Délka — popisek", name: "delka_label", widget: "string", hint: "např. 51–55" }
              - { label: "Gramáž (g)", name: "gramaz", widget: "number" }
              - { label: "Cena za gram (Kč)", name: "cena_g", widget: "number", hint: "Celková cena se dopočítá sama: gramáž × cena za gram." }
              - { label: "Fotka", name: "foto", widget: "image" }
              - { label: "Popisek fotky (pro čtečky a SEO)", name: "foto_alt", widget: "string", required: false }
              - { label: "Zobrazit na hlavní stránce", name: "vyber_domu", widget: "boolean", default: false, hint: "Zaškrtněte max. u 3 kusů — zobrazí se v sekci „Aktuálně k dispozici“." }

  - name: "nastaveni"
    label: "Kontaktní údaje"
    description: "Tyto údaje se automaticky promítnou na všech stránkách webu (patička, kontakty, WhatsApp odkazy…)."
    files:
      - file: "data/site.json"
        label: "Kontakt a sociální sítě"
        name: "site"
        fields:
          - { label: "Telefon (zobrazovaný text)", name: "telefon_zobrazit", widget: "string", hint: "např. +420 608 784 440" }
          - { label: "WhatsApp číslo (jen číslice, s předvolbou)", name: "telefon_whatsapp", widget: "string", hint: "např. 420608784440 — bez mezer a plus" }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Instagram — zobrazovaný handle", name: "instagram_handle", widget: "string" }
          - { label: "Instagram — odkaz", name: "instagram_url", widget: "string" }
          - { label: "Facebook — odkaz", name: "facebook_url", widget: "string", required: false }
          - { label: "Lokalita — krátká (patička)", name: "lokalita_kratka", widget: "string" }
          - { label: "Lokalita — delší (stránka Kontakt)", name: "lokalita_dlouha", widget: "string" }

  - name: "fotky"
    label: "Fotky na webu"
    description: "Jedna konkrétní fotka na jednom konkrétním místě webu. Nahrajte novou a nahradí tu starou přesně tam, kde je popsáno."
    files:
      - file: "data/images.json"
        label: "Pojmenované fotky"
        name: "images"
        fields:
          - label: "Hero fotka — Domů (úvodní)"
            name: "hero_domu"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — Domů, sekce „Proč Silki“"
            name: "proc_silki"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — Domů, sekce Kurzy"
            name: "kurzy_teaser_domu"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — Domů, sekce Blond"
            name: "blond_teaser_domu"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — O nás, úvodní příběh"
            name: "onas_pribeh"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — O nás, sekce Kurzy"
            name: "onas_kurzy"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — Blond, „Základ kvality“"
            name: "blond_zaklad_kvality"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — Kurzy, „Obsah kurzu“"
            name: "kurzy_obsah"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — Pro kadeřnice, návaznost na kurz"
            name: "kadernice_kurz"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — Reference, „Před“"
            name: "reference_pred"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
          - label: "Fotka — Reference, „Po“"
            name: "reference_po"
            widget: "object"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }

  - name: "galerie"
    label: "Galerie proměn"
    description: "Fotky v sekci Galerie na stránce Reference. Na rozdíl od fotek výše jich může být libovolný počet — přidávejte, mažte i přeskupujte podle potřeby."
    files:
      - file: "data/galerie.json"
        label: "Fotky galerie"
        name: "galerie"
        fields:
          - label: "Fotky"
            name: "polozky"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Fotka", name: "src", widget: "image" }
              - { label: "Popisek (pro čtečky a SEO)", name: "alt", widget: "string", required: false }
